<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Merlin SIP</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <section class="phone-screen">
        <header class="dialer-header">
          <div>
            <span class="eyebrow">Merlin SIP</span>
            <h1>Dial</h1>
          </div>
        </header>

        <section class="dialer-view view active-view" id="dialerView">
          <section class="number-stage">
            <div class="dial-card-head">
              <div>
                <span class="eyebrow">Dial</span>
                <h2>Enter number</h2>
                <p id="notice">No matching contact</p>
              </div>
              <div class="dial-card-actions">
                <span class="status" id="connectionBadge">Inactive</span>
                <div class="top-actions">
                  <button class="icon-button" id="historyToggle" type="button" aria-label="Call history" title="Call history">History</button>
                  <button class="icon-button" id="settingsToggle" type="button" aria-label="Settings" title="Settings">Settings</button>
                </div>
              </div>
            </div>
            <div class="number-row">
              <input id="destination" value="" inputmode="tel" autocomplete="off" aria-label="Number to dial" />
              <button class="secondary-action" id="clearButton" type="button">Clear</button>
            </div>
          </section>

          <div class="dialpad" id="dialpad"></div>

          <div class="primary-call-row">
            <button class="call-button" id="callButton" type="button">Call</button>
            <button class="end-button" id="endButton" type="button">End</button>
          </div>

          <div class="always-call-controls">
            <button id="muteButton" type="button">Mute</button>
            <button id="holdButton" type="button">Hold</button>
            <button id="transferButton" type="button">Transfer</button>
            <button id="dndButton" type="button" aria-pressed="false">DND</button>
          </div>

          <section class="in-call-actions hidden" id="inCallActions">
            <div class="active-call-bar">
              <strong>Active call</strong>
              <span id="activeCallLabel"></span>
            </div>
            <button class="hidden" id="parkButton" type="button">Park</button>
            <button class="hidden" id="pauseButton" type="button">Queue pause</button>
          </section>
        </section>

        <section class="transfer-popup hidden" id="transferPopup" aria-label="Transfer type" role="dialog">
          <div class="transfer-panel">
            <h2>Transfer</h2>
            <p>Enter target and choose transfer type</p>
            <label>Target<input id="transferTarget" inputmode="tel" autocomplete="off" /></label>
            <div class="transfer-options">
              <button id="assistedTransferButton" type="button">Assisted</button>
              <button id="blindTransferButton" type="button">Blind</button>
            </div>
            <button class="secondary-action" id="closeTransferPopup" type="button">Cancel</button>
          </div>
        </section>

        <section class="history-sheet view" id="historyView">
          <header class="sheet-head">
            <div>
              <span class="eyebrow">Calls</span>
              <h2>History</h2>
            </div>
            <button class="icon-button" id="closeHistoryButton" type="button">Done</button>
          </header>
          <div class="history-list" id="fullCallHistory"></div>
        </section>

        <section class="settings-sheet view" id="settingsView">
          <header class="sheet-head">
            <div>
              <span class="eyebrow">Account</span>
              <h2>Connection</h2>
            </div>
            <button class="icon-button" id="closeSettingsButton" type="button">Done</button>
          </header>

          <label>Username<input id="username" autocomplete="username" /></label>
          <label>Auth ID<input id="authId" autocomplete="username" /></label>
          <label>Password<input id="password" type="password" /></label>
          <div class="settings-actions">
            <button id="saveConfig" type="button">Save</button>
            <button id="registerSip" type="button">Register</button>
          </div>
        </section>
      </section>
    </main>
    <script src="./app.js"></script>
  </body>
</html>
